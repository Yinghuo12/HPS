syntax = "proto3";
package ddt;

// ---- 登录 ----
message LoginRequest {
  string name     = 1;
  string password = 2;
}

message LoginResponse {
  bool   ok    = 1;
  uint32 id    = 2;
  string msg   = 3;
  string token = 4;
}

// ---- 注册 ----
message RegisterRequest {
  string name     = 1;
  string password = 2;
}

message RegisterResponse {
  bool   ok  = 1;
  uint32 id  = 2;
  string msg = 3;
}
