syntax = "proto3";
package ddt;

import "common.proto";

// ---- 聊天 ----
message ChatRequest {
  ChannelType channel = 1;
  string      message = 2;
}

message ChatNotify {
  ChannelType channel     = 1;
  uint32      sender_id   = 2;
  string      sender_name = 3;
  string      message     = 4;
  uint64      timestamp   = 5;
}

message ChatHistoryRequest {
  ChannelType channel = 1;
  int32       count   = 2;
}

message ChatHistoryResponse {
  ChannelType              channel  = 1;
  repeated ChatNotify      messages = 2;
}

message PrivateChatRequest {
  uint32 target_id = 1;
  string message   = 2;
}

// ---- 好友 ----
message FriendAddRequest {
  string target_name = 1;
}

message FriendAddResponse {
  bool   ok          = 1;
  string msg         = 2;
  uint32 friend_id   = 3;
  string friend_name = 4;
}

message FriendListRequest {}

message FriendListResponse {
  repeated FriendInfo friends = 1;
}

message FriendInfo {
  uint32 id       = 1;
  string name     = 2;
  bool   online   = 3;
  int32  level    = 4;
}
